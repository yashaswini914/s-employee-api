name: Employee SAPI CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: Build and Test SAPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17 and Exchange Maven authentication
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: anypoint-exchange-v3
          server-username: ANYPOINT_MAVEN_USERNAME
          server-password: ANYPOINT_MAVEN_PASSWORD

      - name: Set up Maven 3.9.9
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: '3.9.9'

      - name: Verify Exchange RAML access before building
        shell: bash
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          test -n "$ANYPOINT_CLIENT_ID" || { echo "::error::ANYPOINT_CLIENT_ID is missing"; exit 1; }
          test -n "$ANYPOINT_CLIENT_SECRET" || { echo "::error::ANYPOINT_CLIENT_SECRET is missing"; exit 1; }

          # Never print the client secret or the assembled Maven password.
          url="https://maven.anypoint.mulesoft.com/api/v3/organizations/64bf67c7-37b5-45e5-a0ea-95fa6c0a7682/maven/64bf67c7-37b5-45e5-a0ea-95fa6c0a7682/employee-api/1.0.1/employee-api-1.0.1.pom"
          status="$(curl --silent --show-error --location --output /dev/null \
            --write-out '%{http_code}' \
            --user "~~~Client~~~:${ANYPOINT_CLIENT_ID}~?~${ANYPOINT_CLIENT_SECRET}" \
            "$url")"
          echo "Exchange RAML descriptor HTTP status: $status"
          case "$status" in
            200) echo "Exchange authentication and RAML descriptor access verified." ;;
            401|403)
              echo "::error::Exchange rejected the Connected App (HTTP $status). Verify the GitHub secrets and Exchange Viewer/Contributor scope for this organization."
              exit 1
              ;;
            404)
              echo "::error::Exchange cannot find employee-api version 1.0.1 at this organization path. Verify the asset coordinates and permissions."
              exit 1
              ;;
            *)
              echo "::error::Unexpected Exchange response: HTTP $status"
              exit 1
              ;;
          esac

      - name: Restore secure.yaml
        shell: bash
        env:
          MULE_SECURE_YAML: ${{ secrets.MULE_SECURE_YAML }}
        run: |
          set -euo pipefail
          test -n "$MULE_SECURE_YAML" || { echo "::error::MULE_SECURE_YAML is missing"; exit 1; }
          mkdir -p src/main/resources/properties
          printf '%s\n' "$MULE_SECURE_YAML" > src/main/resources/properties/secure.yaml
          chmod 600 src/main/resources/properties/secure.yaml
          ruby -e 'require "yaml"; YAML.load_file(ARGV[0])' src/main/resources/properties/secure.yaml

      - name: Build and run MUnit tests
        shell: bash
        env:
          ANYPOINT_MAVEN_USERNAME: "~~~Client~~~"
          ANYPOINT_MAVEN_PASSWORD: "${{ secrets.ANYPOINT_CLIENT_ID }}~?~${{ secrets.ANYPOINT_CLIENT_SECRET }}"
          MULE_SECURE_KEY: ${{ secrets.MULE_SECURE_KEY }}
          MAVEN_OPTS: -Xmx2048m
        run: |
          set -euo pipefail
          test -n "$MULE_SECURE_KEY" || { echo "::error::MULE_SECURE_KEY is missing"; exit 1; }
          mvn -B clean verify -Dsecure.key="$MULE_SECURE_KEY"

      - name: Upload MUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sapi-munit-reports
          path: |
            target/surefire-reports/
            target/munit-reports/
            target/site/munit/
          if-no-files-found: warn

      - name: Upload packaged application
        uses: actions/upload-artifact@v4
        with:
          name: sapi-application
          path: target/*-mule-application.jar
          if-no-files-found: error

  cd:
    name: Deploy SAPI to CloudHub 2.0
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17 and Exchange Maven authentication
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: anypoint-exchange-v3
          server-username: ANYPOINT_MAVEN_USERNAME
          server-password: ANYPOINT_MAVEN_PASSWORD

      - name: Set up Maven 3.9.9
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: '3.9.9'

      - name: Download packaged application
        uses: actions/download-artifact@v4
        with:
          name: sapi-application
          path: target

      - name: Publish application to Anypoint Exchange
        shell: bash
        env:
          ANYPOINT_MAVEN_USERNAME: "~~~Client~~~"
          ANYPOINT_MAVEN_PASSWORD: "${{ secrets.ANYPOINT_CLIENT_ID }}~?~${{ secrets.ANYPOINT_CLIENT_SECRET }}"
          MULE_SECURE_YAML: ${{ secrets.MULE_SECURE_YAML }}
          MULE_SECURE_KEY: ${{ secrets.MULE_SECURE_KEY }}
          MAVEN_OPTS: -Xmx2048m
        run: |
          set -euo pipefail
          test -n "$MULE_SECURE_YAML" || { echo "::error::MULE_SECURE_YAML is missing"; exit 1; }
          test -n "$MULE_SECURE_KEY" || { echo "::error::MULE_SECURE_KEY is missing"; exit 1; }
          mkdir -p src/main/resources/properties
          printf '%s\n' "$MULE_SECURE_YAML" > src/main/resources/properties/secure.yaml
          chmod 600 src/main/resources/properties/secure.yaml
          mvn -B deploy -DskipTests -Dsecure.key="$MULE_SECURE_KEY"

      - name: Deploy to CloudHub 2.0
        shell: bash
        env:
          ANYPOINT_MAVEN_USERNAME: "~~~Client~~~"
          ANYPOINT_MAVEN_PASSWORD: "${{ secrets.ANYPOINT_CLIENT_ID }}~?~${{ secrets.ANYPOINT_CLIENT_SECRET }}"
          CH2_CLIENT_ID: ${{ secrets.CH2_CLIENT_ID }}
          CH2_CLIENT_SECRET: ${{ secrets.CH2_CLIENT_SECRET }}
          MULE_SECURE_KEY: ${{ secrets.MULE_SECURE_KEY }}
          CH2_TARGET: ${{ vars.CH2_TARGET }}
          CH2_ENVIRONMENT: ${{ vars.CH2_ENVIRONMENT }}
          ANYPOINT_PLATFORM_CLIENT_ID: ${{ secrets.ANYPOINT_PLATFORM_CLIENT_ID }}
          ANYPOINT_PLATFORM_CLIENT_SECRET: ${{ secrets.ANYPOINT_PLATFORM_CLIENT_SECRET }}
          MAVEN_OPTS: -Xmx2048m
        run: |
          set -euo pipefail
          for name in CH2_CLIENT_ID CH2_CLIENT_SECRET MULE_SECURE_KEY CH2_TARGET CH2_ENVIRONMENT ANYPOINT_PLATFORM_CLIENT_ID ANYPOINT_PLATFORM_CLIENT_SECRET; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is missing or empty"
              exit 1
            fi
          done

          ARTIFACT="$(find target -maxdepth 1 -type f -name '*-mule-application.jar' -print -quit)"
          if [[ -z "$ARTIFACT" ]]; then
            echo "::error::Mule application JAR not found"
            ls -la target
            exit 1
          fi

          echo "Environment: $CH2_ENVIRONMENT"
          echo "Target: $CH2_TARGET"
          echo "Application artifact: $ARTIFACT"

          mvn -B mule:deploy \
            -Dmule.artifact="$GITHUB_WORKSPACE/$ARTIFACT" \
            -Ddeploy.environment="$CH2_ENVIRONMENT" \
            -Ddeploy.target="$CH2_TARGET" \
            -Ddeploy.clientId="$CH2_CLIENT_ID" \
            -Ddeploy.clientSecret="$CH2_CLIENT_SECRET" \
            -Dplatform.clientId="$ANYPOINT_PLATFORM_CLIENT_ID" \
            -Dplatform.clientSecret="$ANYPOINT_PLATFORM_CLIENT_SECRET" \
            -Dsecure.key="$MULE_SECURE_KEY"
