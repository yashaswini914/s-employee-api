
name: System API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

    
      - name: Set up Java 17 and Maven authentication
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: anypoint-exchange-v3
          server-username: ANYPOINT_MAVEN_USERNAME
          server-password: ANYPOINT_MAVEN_PASSWORD


     
      - name: Set up Maven 3.9.9
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: '3.9.9'



     

      - name: Check Maven version
        run: mvn -version

      - name: Build and run MUnit tests
        run: mvn -B clean verify
        env:
          ANYPOINT_MAVEN_USERNAME: "~~~Client~~~"
          ANYPOINT_MAVEN_PASSWORD: "${{ secrets.ANYPOINT_CLIENT_ID }}~?~${{ secrets.ANYPOINT_CLIENT_SECRET }}"
          MAVEN_OPTS: -Xmx2048m

       