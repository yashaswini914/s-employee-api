name: System API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17 and Maven authentication
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: anypoint-exchange-v3
          server-username: ANYPOINT_MAVEN_USERNAME
          server-password: ANYPOINT_MAVEN_PASSWORD

      - name: Set up Maven 3.9.9
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: '3.9.9'

      - name: Check Maven version
        run: mvn -version

      - name: Restore secure properties file
        env:
          MULE_SECURE_YAML: ${{ secrets.MULE_SECURE_YAML }}
        run: |
          mkdir -p src/main/resources/properties
          if [ -z "$MULE_SECURE_YAML" ]; then
            echo "MULE_SECURE_YAML secret is empty or unavailable"
            exit 1
          fi
          printf '%s\n' "$MULE_SECURE_YAML" > src/main/resources/properties/secure.yaml

      - name: Install PyYAML
        run: python -m pip install PyYAML

      - name: Validate secure YAML
        run: |
          python - <<'PY'
          import yaml
          path = "src/main/resources/properties/secure.yaml"
          with open(path, encoding="utf-8") as f:
              data = yaml.safe_load(f)
          assert isinstance(data, dict), "Secure YAML must contain a mapping"
          print("Secure YAML syntax is valid")
          PY

      - name: Build and run MUnit tests
        run: mvn -B clean verify -Dsecure.key="$MULE_SECURE_KEY"
        env:
          ANYPOINT_MAVEN_USERNAME: "~~~Client~~~"
          ANYPOINT_MAVEN_PASSWORD: "${{ secrets.ANYPOINT_CLIENT_ID }}~?~${{ secrets.ANYPOINT_CLIENT_SECRET }}"
          MULE_SECURE_KEY: ${{ secrets.MULE_SECURE_KEY }}
          MAVEN_OPTS: -Xmx2048m