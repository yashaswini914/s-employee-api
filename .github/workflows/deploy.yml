name: Deploy S-Employee API

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      ANYPOINT_MAVEN_USERNAME: ${{ secrets.ANYPOINT_CLIENT_ID }}
      ANYPOINT_MAVEN_PASSWORD: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
      MULE_SECURE_KEY: ${{ secrets.MULE_SECURE_KEY }}
      MAVEN_OPTS: -Xmx2048m

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Secure Properties File
        run: |
          mkdir -p src/main/resources
          echo "${{ secrets.MULE_SECURE_YAML }}" > src/main/resources/secure.yaml

      - name: Create Maven Settings
        run: |
          mkdir -p ~/.m2

          cat > ~/.m2/settings.xml << EOF
          <settings>
            <servers>
              <server>
                <id>anypoint-exchange-v3</id>
                <username>${ANYPOINT_MAVEN_USERNAME}</username>
                <password>${ANYPOINT_MAVEN_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Validate Build
        run: |
          mvn -B clean verify \
            -Dsecure.key==${{ secrets.MULE_SECURE_KEY }}