name: Deploy S-Employee API

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Secure Properties File
        run: |
          mkdir -p src/main/resources
          echo "${{ secrets.MULE_SECURE_YAML }}" > src/main/resources/secure.yaml

      - name: Configure Maven Settings
        run: |
          mkdir -p ~/.m2

          cat > ~/.m2/settings.xml << EOF
          <settings>
            <servers>
              <server>
                <id>anypoint-exchange-v3</id>
                <username>${{ secrets.ANYPOINT_CLIENT_ID }}</username>
                <password>${{ secrets.ANYPOINT_CLIENT_SECRET }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Validate Build
        run: mvn clean package -DskipTests

      - name: Deploy CH2
        run: |
          mvn deploy \
            -DmuleDeploy \
            -Ddeploy.environment=${{ vars.CH2_ENVIRONMENT }} \
            -Ddeploy.target=${{ vars.CH2_TARGET }} \
            -Ddeploy.clientId=${{ secrets.CH2_CLIENT_ID }} \
            -Ddeploy.clientSecret=${{ secrets.CH2_CLIENT_SECRET }} \
            -Dplatform.clientId=${{ secrets.ANYPOINT_PLATFORM_CLIENT_ID }} \
            -Dplatform.clientSecret=${{ secrets.ANYPOINT_PLATFORM_CLIENT_SECRET }} \
            -Dsecure.key=${{ secrets.MULE_SECURE_KEY }}